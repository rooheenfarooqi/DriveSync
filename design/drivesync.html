<title>DriveSync Desktop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a Windows 11 desktop — wallpaper, one floating Mica window (title bar, nav rail, content, preview pane), a slim taskbar.
   Single deliberate dark look: deep blue-black ground, frosted layers, one teal accent taken from the DriveSync deck. */
:root{
  color-scheme: dark;
  /* ground & glass */
  --wall-1:#05070a; --wall-2:#0a1418; --wall-3:#0c1a2a;
  --mica: 16 21 27;            /* rgb of the window surface; alpha comes from --glass */
  --glass: .74;                /* Transparency effects slider writes this */
  --layer: rgba(255,255,255,.035);
  --layer-2: rgba(255,255,255,.06);
  --layer-3: rgba(255,255,255,.09);
  --stroke: rgba(255,255,255,.075);
  --stroke-2: rgba(255,255,255,.13);
  --hairline-top: rgba(255,255,255,.10);
  --scrim: rgba(3,6,9,.58);
  /* text */
  --text:#e8eef0; --text-2:#a3afb4; --text-3:#6c787d; --text-on-accent:#03201d;
  /* accent (Settings → Appearance writes --accent) */
  --accent:#3fd0c0;
  --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 45%, transparent);
  /* semantic */
  --ok:#5fd394; --warn:#f2c25c; --err:#ff6f6f; --info:#7ab8ff;
  --ok-soft: rgba(95,211,148,.13); --warn-soft: rgba(242,194,92,.13); --err-soft: rgba(255,111,111,.13);
  /* file-type hues */
  --t-doc:#6ea8ff; --t-pdf:#ff7a6b; --t-sheet:#5fd394; --t-slides:#f5a35c; --t-code:#b99bff; --t-img:#f07ac0; --t-txt:#9fb0b6; --t-db:#58c7d6; --t-zip:#d9c06b;
  /* type */
  --f-display:"Sora","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-body:"Segoe UI Variable Text","Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --fs-cap:11.5px; --fs-sm:12.5px; --fs-body:13.5px; --fs-md:15px; --fs-lg:19px; --fs-xl:26px; --fs-2xl:34px;
  /* space, radius, depth */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-sm:4px; --r-md:8px; --r-lg:12px; --r-xl:16px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.35);
  --shadow-2: 0 8px 24px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.04) inset;
  --shadow-win: 0 32px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  --ease: cubic-bezier(.2,.8,.2,1);
  --dur: .18s;
}
html,body{height:100%}
body{
  background: var(--wall-1); color: var(--text); font: 400 var(--fs-body)/1.5 var(--f-body);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
::selection{background:var(--accent-soft)}
.mono{font-family:var(--f-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.lg{width:20px;height:20px} svg.i.xl{width:28px;height:28px}

/* ---------- Desktop ---------- */
.desktop{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(1100px 700px at 12% 18%, rgba(30,120,118,.30), transparent 60%),
    radial-gradient(900px 640px at 88% 78%, rgba(32,64,140,.32), transparent 62%),
    radial-gradient(700px 500px at 70% 10%, rgba(18,90,110,.18), transparent 60%),
    linear-gradient(160deg, var(--wall-3), var(--wall-2) 45%, var(--wall-1));
}
.desktop::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size:3px 3px}
.wall-mark{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.18);pointer-events:none;transition:opacity .4s}
.wall-mark b{display:block;font:600 64px/1 var(--f-display);letter-spacing:-.02em}
.wall-mark span{font-size:13px;letter-spacing:.3em;text-transform:uppercase}

/* ---------- Window ---------- */
.window{position:absolute;left:50%;top:calc(50% - 24px);transform:translate(-50%,-50%);
  width:min(1440px, calc(100% - 48px)); height:min(880px, calc(100% - 48px - 48px));
  display:grid;grid-template-rows:40px 1fr;
  background: rgb(var(--mica) / var(--glass));
  backdrop-filter: blur(40px) saturate(140%); -webkit-backdrop-filter: blur(40px) saturate(140%);
  border-radius: var(--r-lg); box-shadow: var(--shadow-win); overflow:hidden; z-index:5;
  transition: transform .28s var(--ease), opacity .22s var(--ease), width .28s var(--ease), height .28s var(--ease), top .28s var(--ease), border-radius .28s;
}
.window::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 var(--hairline-top);z-index:3}
.window.max{width:100%;height:calc(100% - 48px);top:calc(50% - 24px);border-radius:0}
.window.min{transform:translate(-50%, 40%) scale(.6);opacity:0;pointer-events:none}
.window.closed{transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none}

/* title bar */
.titlebar{display:flex;align-items:center;gap:var(--s3);padding-left:var(--s4);user-select:none;-webkit-user-select:none;position:relative;z-index:2}
.titlebar .app-glyph{width:18px;height:18px}
.titlebar .t-name{font-weight:600;font-size:12.5px;letter-spacing:.01em}
.titlebar .t-crumb{color:var(--text-3);font-size:12.5px;display:flex;align-items:center;gap:6px}
.titlebar .grow{flex:1}
.status-chip{display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;border-radius:999px;background:var(--layer);border:1px solid var(--stroke);font-size:12px;color:var(--text-2);transition:background var(--dur)}
.status-chip:hover{background:var(--layer-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none}
.dot.live{animation:pulse 2.4s infinite}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
.dot.busy{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);animation:pulse 1s infinite}
.dot.err{background:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.wctl{display:flex;height:100%}
.wctl button{width:46px;height:100%;display:grid;place-items:center;color:var(--text-2);transition:background .12s}
.wctl button:hover{background:var(--layer-3);color:var(--text)}
.wctl button.close:hover{background:#c42b1c;color:#fff}
.wctl svg{width:10px;height:10px;stroke-width:1}

/* shell */
.shell{display:grid;grid-template-columns:var(--nav-w,236px) 1fr;min-height:0;transition:grid-template-columns .25s var(--ease)}
.shell.collapsed{--nav-w:60px}

/* nav */
.nav{display:flex;flex-direction:column;gap:2px;padding:var(--s2) var(--s2) var(--s3);min-height:0;overflow:hidden}
.nav .burger{width:40px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--text-2);margin:0 0 6px 2px}
.nav .burger:hover{background:var(--layer-2)}
.nav-item{position:relative;display:flex;align-items:center;gap:14px;height:38px;padding:0 12px 0 14px;border-radius:var(--r-md);color:var(--text-2);white-space:nowrap;transition:background .12s,color .12s;text-decoration:none}
.nav-item:hover{background:var(--layer-2);color:var(--text)}
.nav-item:active{background:var(--layer)}
.nav-item[aria-current="page"]{background:var(--layer-2);color:var(--text)}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:0;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:3px;background:var(--accent);animation:pill .25s var(--ease)}
@keyframes pill{from{height:6px;margin-top:-3px}to{height:16px;margin-top:-8px}}
.nav-item .lbl{flex:1;transition:opacity .2s}
.nav-item .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--text-on-accent);font-size:11px;font-weight:700;display:grid;place-items:center}
.shell.collapsed .nav-item .lbl,.shell.collapsed .nav-item .badge,.shell.collapsed .nav-foot .mini{opacity:0;pointer-events:none}
.shell.collapsed .nav-item .badge{position:absolute;opacity:1;right:4px;top:4px;min-width:8px;height:8px;padding:0;font-size:0}
.nav .sep{height:1px;background:var(--stroke);margin:8px 6px}
.nav-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.mini{margin:6px 2px 8px;padding:12px;border-radius:var(--r-lg);background:var(--layer);border:1px solid var(--stroke);transition:opacity .2s;white-space:nowrap}
.mini .row{display:flex;align-items:center;gap:8px;font-size:12px}
.mini .sub{font-size:11.5px;color:var(--text-3);margin-top:4px}
.bar{height:4px;border-radius:4px;background:var(--layer-3);overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .3s linear}
.bar.indet > i{width:35%;animation:indet 1.2s infinite var(--ease)}
@keyframes indet{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* content */
.content{position:relative;min-width:0;min-height:0;background:rgba(255,255,255,.025);border-top-left-radius:var(--r-lg);border-top:1px solid var(--stroke);border-left:1px solid var(--stroke);overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;padding:var(--s6) var(--s8) var(--s8);animation:viewin .28s var(--ease)}
.view[hidden]{display:none}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.view::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:10px;height:10px}
.view::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.view::-webkit-scrollbar-thumb:hover,.scroll::-webkit-scrollbar-thumb:hover{background-color:rgba(255,255,255,.2)}
.page-head{display:flex;align-items:flex-end;gap:var(--s4);flex-wrap:wrap;margin-bottom:var(--s5)}
.page-head h1{font:600 var(--fs-xl)/1.15 var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--text-2)}
.page-head .grow{flex:1;min-width:200px}
.section-title{font:600 var(--fs-md)/1.3 var(--f-body);margin:0 0 var(--s3);display:flex;align-items:center;gap:8px}
.eyebrow{font-size:var(--fs-cap);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:600}

/* surfaces */
.card{background:var(--layer);border:1px solid var(--stroke);border-radius:var(--r-lg);padding:var(--s4)}
.card.flush{padding:0}
.card.raised{background:var(--layer-2);box-shadow:var(--shadow-2)}
.card.hover{transition:background .15s,border-color .15s,transform .15s}
.card.hover:hover{background:var(--layer-2);border-color:var(--stroke-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;white-space:nowrap;
  background:var(--layer-2);border:1px solid var(--stroke);border-bottom-color:rgba(255,255,255,.04);color:var(--text);transition:background .12s,transform .08s,border-color .12s,opacity .12s}
.btn:hover{background:var(--layer-3)}
.btn:active{transform:scale(.98);background:var(--layer);color:var(--text-2)}
.btn.primary{background:var(--accent);border-color:color-mix(in srgb,var(--accent) 70%,white);color:var(--text-on-accent);font-weight:600}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,white)}
.btn.primary:active{background:color-mix(in srgb,var(--accent) 80%,black)}
.btn.danger{background:rgba(255,111,111,.16);border-color:rgba(255,111,111,.32);color:#ffd2d2}
.btn.danger:hover{background:rgba(255,111,111,.26)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--layer-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:28px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:12.5px;color:var(--text-2);font-weight:500}
.input{height:34px;padding:0 12px;border-radius:var(--r-md);background:rgba(0,0,0,.22);border:1px solid var(--stroke);border-bottom:1px solid rgba(255,255,255,.22);outline:none;width:100%;transition:border-color .12s,background .12s}
.input:hover{background:rgba(0,0,0,.28)}
.input:focus{border-bottom:2px solid var(--accent);background:rgba(0,0,0,.34)}
.input.bad{border-bottom:2px solid var(--err)}
.hint{font-size:12px;color:var(--text-3)} .hint.err{color:var(--err)} .hint.warn{color:var(--warn)} .hint.ok{color:var(--ok)}

/* toggle */
.toggle{position:relative;width:40px;height:20px;border-radius:10px;border:1px solid var(--text-2);background:transparent;flex:none;transition:background .15s,border-color .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--text-2);transition:transform .18s var(--ease),width .12s,background .15s}
.toggle:hover::after{width:14px;height:14px;top:2px}
.toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked="true"]::after{background:var(--text-on-accent);transform:translateX(20px)}
.toggle[aria-checked="true"]:hover::after{transform:translateX(18px)}
.toggle-wrap{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2)}

/* checkbox */
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px;user-select:none}
.check input{position:absolute;opacity:0;pointer-events:none}
.check .box{width:18px;height:18px;border-radius:4px;border:1px solid var(--text-2);display:grid;place-items:center;transition:background .12s,border-color .12s;flex:none}
.check .box svg{width:12px;height:12px;stroke:var(--text-on-accent);stroke-width:2.2;opacity:0;transform:scale(.6);transition:.15s var(--ease)}
.check input:checked + .box{background:var(--accent);border-color:var(--accent)}
.check input:checked + .box svg{opacity:1;transform:none}
.check input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}

/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:180px;height:20px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--text-3) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-8px;background:#454f55;border:5px solid #454f55;box-shadow:inset 0 0 0 6px var(--accent);transition:box-shadow .12s}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:inset 0 0 0 5px var(--accent)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--text-3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:4px solid #454f55}

/* segmented */
.seg{display:inline-flex;padding:3px;border-radius:var(--r-md);background:rgba(0,0,0,.2);border:1px solid var(--stroke);gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:5px;font-size:12.5px;color:var(--text-2);transition:background .12s,color .12s}
.seg button:hover{color:var(--text);background:var(--layer)}
.seg button[aria-pressed="true"]{background:var(--layer-3);color:var(--text);box-shadow:var(--shadow-1)}

/* dropdown */
.dd{position:relative;display:inline-block}
.dd-btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 12px;border-radius:var(--r-md);background:var(--layer-2);border:1px solid var(--stroke);font-size:12.5px;color:var(--text);white-space:nowrap;transition:background .12s}
.dd-btn:hover{background:var(--layer-3)}
.dd-btn .k{color:var(--text-3)}
.dd-btn svg{width:12px;height:12px;color:var(--text-2);transition:transform .2s var(--ease)}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.menu{position:fixed;z-index:80;min-width:200px;padding:4px;border-radius:var(--r-lg);background:rgba(34,40,46,.92);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid var(--stroke-2);box-shadow:0 16px 40px rgba(0,0,0,.5);animation:menuin .16s var(--ease);transform-origin:top}
@keyframes menuin{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:5px;font-size:13px;text-align:left;color:var(--text)}
.menu button:hover,.menu button.kb{background:var(--layer-3)}
.menu button .tick{width:14px;height:14px;color:var(--accent);opacity:0}
.menu button[aria-checked="true"] .tick{opacity:1}
.menu button .kbd{margin-left:auto;color:var(--text-3);font-size:11.5px}
.menu button.danger{color:#ffb4b4}
.menu hr{border:0;height:1px;background:var(--stroke);margin:4px 2px}

/* tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;padding:5px 9px;border-radius:6px;background:rgba(40,46,52,.97);border:1px solid var(--stroke-2);font-size:12px;font-weight:400;color:var(--text);box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:90;pointer-events:none;animation:tipin .15s .35s both}
[data-tip-pos="up"]:hover::after{top:auto;bottom:calc(100% + 8px)}
@keyframes tipin{from{opacity:0}to{opacity:1}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--layer-2);border:1px solid var(--stroke);font-size:12px;color:var(--text-2);transition:background .12s,color .12s}
button.chip:hover{background:var(--layer-3);color:var(--text)}
.chip svg{width:12px;height:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--err-soft);color:var(--err)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.mut{background:var(--layer-2);color:var(--text-2)}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--stroke-2);border-bottom-width:2px;color:var(--text-2);background:var(--layer)}

/* file glyph */
.fg{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;position:relative;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.fg svg{width:17px;height:17px}
.fg.lg{width:52px;height:52px;border-radius:12px}.fg.lg svg{width:26px;height:26px}
.fg .ext{position:absolute;bottom:-5px;right:-6px;font:700 8.5px/1 var(--f-mono);padding:2px 3px;border-radius:3px;background:var(--c);color:#0b0f12;letter-spacing:.02em}

/* ---------- Home ---------- */
.hero-search{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 18px;border-radius:var(--r-xl);background:rgba(0,0,0,.25);border:1px solid var(--stroke-2);box-shadow:var(--shadow-2);transition:border-color .15s,box-shadow .15s}
.hero-search:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow-2)}
.hero-search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:none;font-size:16px}
.hero-search input::placeholder{color:var(--text-3)}
.grid-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.stat{padding:var(--s4);border-radius:var(--r-lg);background:var(--layer);border:1px solid var(--stroke);min-width:0}
.stat .k{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12.5px}
.stat .v{font:600 28px/1.1 var(--f-display);letter-spacing:-.02em;margin-top:10px;font-variant-numeric:tabular-nums}
.stat .v small{font:500 13px var(--f-body);color:var(--text-2);margin-left:4px;letter-spacing:0}
.stat .d{font-size:12px;color:var(--text-3);margin-top:4px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s4);margin-top:var(--s4)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);min-width:0;transition:background .12s;text-align:left;width:100%}
button.li:hover,a.li:hover{background:var(--layer-2)}
.li .main{flex:1;min-width:0}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.li .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-3);font-size:12px}
.li .r{color:var(--text-3);font-size:12px;white-space:nowrap}
.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.stage{position:relative;padding:12px;border-radius:var(--r-md);background:var(--layer);border:1px solid var(--stroke);min-width:0}
.stage .n{font:600 11px var(--f-mono);color:var(--accent)}
.stage .t{font-weight:600;margin-top:2px}
.stage .s{font-size:12px;color:var(--text-3);margin-top:2px}
.stage.on{border-color:var(--accent-line);background:var(--accent-soft)}

/* ---------- Search ---------- */
.view.search{padding:0;display:grid;grid-template-rows:auto auto 1fr}
.search-top{padding:var(--s5) var(--s6) var(--s3);display:flex;flex-direction:column;gap:var(--s3)}
.qbox{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 14px;border-radius:var(--r-lg);background:rgba(0,0,0,.25);border:1px solid var(--stroke);border-bottom:1px solid rgba(255,255,255,.2);transition:border-color .12s,box-shadow .12s}
.qbox:focus-within{border-bottom:2px solid var(--accent)}
.qbox input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15px;height:100%}
.qbox input::placeholder{color:var(--text-3)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .meta{margin-left:auto;font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.timing{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding:2px 8px;border-radius:6px;background:var(--accent-soft)}
.search-body{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0;border-top:1px solid var(--stroke)}
.results{overflow:auto;min-height:0;padding:6px 8px 16px}
.rhead{display:grid;grid-template-columns:minmax(0,1fr) 120px 80px;gap:12px;padding:8px 14px 6px 58px;font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;position:sticky;top:-6px;background:rgb(var(--mica) / .9);backdrop-filter:blur(10px);z-index:1}
.rhead button{text-align:left;text-transform:inherit;letter-spacing:inherit;font-weight:inherit;color:inherit}
.rhead button:hover{color:var(--text)}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) 120px 80px;gap:12px;align-items:center;padding:8px 14px 8px 12px;border-radius:var(--r-md);cursor:default;position:relative;transition:background .1s;text-align:left;width:100%}
.row:hover{background:var(--layer)}
.row.sel{background:var(--layer-2)}
.row.sel::before{content:"";position:absolute;left:0;top:50%;width:3px;height:18px;margin-top:-9px;border-radius:3px;background:var(--accent)}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .pth{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-3);font-family:var(--f-mono);font-size:11.5px;margin-top:1px;direction:ltr}
.row .c{font-size:12px;color:var(--text-2);white-space:nowrap}
.row .c.sz{text-align:right;font-variant-numeric:tabular-nums}
mark{background:transparent;color:var(--accent);font-weight:700}
.row.new .nm::after{content:"New";margin-left:8px;font-size:10.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:4px;vertical-align:1px}
.more-row{display:flex;justify-content:center;padding:12px}

/* preview pane */
.preview{border-left:1px solid var(--stroke);min-height:0;overflow:auto;display:flex;flex-direction:column;background:rgba(0,0,0,.08)}
.pv-head{padding:var(--s5) var(--s5) var(--s4);display:flex;gap:14px;align-items:flex-start}
.pv-head h2{margin:0;font:600 16px/1.3 var(--f-body);word-break:break-word}
.pv-head .p{font-family:var(--f-mono);font-size:11.5px;color:var(--text-3);word-break:break-all;margin-top:4px}
.pv-actions{display:flex;gap:6px;padding:0 var(--s5) var(--s4);flex-wrap:wrap}
.tabs{display:flex;gap:4px;padding:0 var(--s5);border-bottom:1px solid var(--stroke)}
.tabs button{position:relative;height:36px;padding:0 10px;font-size:13px;color:var(--text-2);font-weight:500}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--accent);animation:tabin .2s var(--ease)}
@keyframes tabin{from{left:45%;right:45%}}
.pv-body{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.sum p{margin:0 0 10px;line-height:1.6;color:var(--text)}
.sum .lead{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.outline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.outline li{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;font-size:13px}
.outline li:hover{background:var(--layer)}
.outline li .lv{font:500 10.5px var(--f-mono);color:var(--text-3);width:22px;flex:none}
.outline li.h2{padding-left:24px}
.outline li.h3{padding-left:40px;color:var(--text-2)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px 12px;font-size:12.5px}
.kv dt{color:var(--text-3)} .kv dd{margin:0;word-break:break-word}
.skel{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--layer-2),var(--layer-3),var(--layer-2));background-size:200% 100%;animation:sh 1.1s infinite linear;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:48px 24px;color:var(--text-2);min-height:260px}
.state h3{margin:6px 0 0;font:600 17px/1.3 var(--f-display);color:var(--text)}
.state p{margin:0;max-width:44ch}
.state .ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:var(--layer-2);border:1px solid var(--stroke);color:var(--text-2)}
.state .ico svg{width:28px;height:28px}
.state.err .ico{color:var(--err);background:var(--err-soft);border-color:rgba(255,111,111,.25)}
.state.warn .ico{color:var(--warn);background:var(--warn-soft)}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;max-width:640px;width:100%;text-align:left}
.tips .card{padding:12px}
.tips code{font-family:var(--f-mono);color:var(--accent);font-size:12px}
.infobar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-md);font-size:12.5px;border:1px solid}
.infobar.warn{background:var(--warn-soft);border-color:rgba(242,194,92,.25);color:#ffe2a6}
.infobar.err{background:var(--err-soft);border-color:rgba(255,111,111,.28);color:#ffd0d0}
.infobar.info{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.infobar .grow{flex:1}

/* ---------- Folders ---------- */
.ftable{width:100%;border-collapse:separate;border-spacing:0}
.ftable th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--stroke)}
.ftable td{padding:12px 14px;border-bottom:1px solid var(--stroke);vertical-align:middle;font-size:13px}
.ftable tr:last-child td{border-bottom:0}
.ftable tbody tr{transition:background .12s}
.ftable tbody tr:hover{background:var(--layer)}
.ftable .acts{display:flex;gap:4px;justify-content:flex-end}
.fpath{display:flex;align-items:center;gap:12px;min-width:0}
.fpath .t{font-weight:600}
.fpath .p{font-family:var(--f-mono);font-size:11.5px;color:var(--text-3);word-break:break-all}
.tbl-wrap{overflow-x:auto}
.excl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.excl .chip{font-family:var(--f-mono);font-size:11.5px;padding-right:4px}
.excl .chip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--text-3)}
.excl .chip button:hover{background:var(--layer-3);color:var(--text)}

/* ---------- Activity ---------- */
.act-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s4)}
.ev{display:grid;grid-template-columns:76px 92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--stroke);font-size:12.5px}
.ev:last-child{border-bottom:0}
.ev.fresh{animation:evin .6s var(--ease)}
@keyframes evin{from{background:var(--accent-soft);transform:translateX(-6px);opacity:0}to{background:transparent}}
.ev .tm{font-family:var(--f-mono);color:var(--text-3);font-size:11.5px}
.ev .pp{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.ev .pp b{color:var(--text);font-weight:500}
.spark{width:100%;height:110px;display:block}
.kpi{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--stroke);font-size:13px}
.kpi:last-child{border-bottom:0}
.kpi span:last-child{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- Benchmarks ---------- */
.bench-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--s4)}
.chart{width:100%;display:block}
.chart text{fill:var(--text-2);font:11px var(--f-body)}
.chart .lbl-mono{font-family:var(--f-mono);font-size:10.5px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.btable{width:100%;border-collapse:collapse;font-size:12.5px}
.btable th,.btable td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--stroke);font-variant-numeric:tabular-nums}
.btable th:first-child,.btable td:first-child{text-align:left}
.btable th{font-size:11px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.btable td.win{color:var(--accent);font-weight:600}

/* ---------- Settings ---------- */
.set-wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s6);align-items:start}
.set-nav{position:sticky;top:0;display:flex;flex-direction:column;gap:2px}
.set-nav button{position:relative;display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border-radius:var(--r-md);color:var(--text-2);text-align:left;font-size:13px}
.set-nav button:hover{background:var(--layer-2);color:var(--text)}
.set-nav button[aria-current="true"]{background:var(--layer-2);color:var(--text)}
.set-nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:50%;width:3px;height:14px;margin-top:-7px;border-radius:3px;background:var(--accent)}
.set-group{display:flex;flex-direction:column;gap:3px;margin-bottom:var(--s6);scroll-margin-top:8px}
.set-group > h3{font:600 14px var(--f-body);margin:0 0 8px}
.set-row{display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--layer);border:1px solid var(--stroke);border-radius:var(--r-md);min-height:66px;flex-wrap:wrap}
.set-row:first-of-type{border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg)}
.set-row:last-child{border-bottom-left-radius:var(--r-lg);border-bottom-right-radius:var(--r-lg)}
.set-row .ic{width:36px;display:grid;place-items:center;color:var(--text-2)}
.set-row .tx{flex:1;min-width:200px}
.set-row .tx b{display:block;font-weight:500}
.set-row .tx span{font-size:12px;color:var(--text-3)}
.set-row .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.swatches{display:flex;gap:8px}
.swatches button{width:28px;height:28px;border-radius:8px;background:var(--sw);border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);transition:transform .12s}
.swatches button:hover{transform:scale(1.08)}
.swatches button[aria-checked="true"]{border-color:var(--text)}
.num-input{width:90px;text-align:right}

/* ---------- Dialogs ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:grid;place-items:center;padding:16px;animation:fade .18s}
.scrim[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.dialog{width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;border-radius:var(--r-xl);background:rgba(30,36,42,.94);backdrop-filter:blur(40px) saturate(140%);-webkit-backdrop-filter:blur(40px) saturate(140%);border:1px solid var(--stroke-2);box-shadow:0 32px 80px rgba(0,0,0,.6);animation:dlgin .22s var(--ease)}
@keyframes dlgin{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.dialog .db{padding:var(--s6)}
.dialog h2{margin:0 0 6px;font:600 20px/1.3 var(--f-display);letter-spacing:-.01em}
.dialog .desc{color:var(--text-2);margin:0 0 var(--s4)}
.dialog .df{display:flex;gap:8px;justify-content:flex-end;padding:var(--s4) var(--s6);background:rgba(0,0,0,.2);border-top:1px solid var(--stroke)}
.dialog .df .btn{min-width:110px}
.dialog .stack{display:flex;flex-direction:column;gap:var(--s4)}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.types-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dialog.wide{width:min(760px,100%)}

/* onboarding */
.ob{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:440px}
.ob-side{padding:var(--s6);background:rgba(0,0,0,.18);border-right:1px solid var(--stroke);display:flex;flex-direction:column;gap:6px}
.ob-step{display:flex;align-items:center;gap:12px;padding:8px 6px;color:var(--text-3);font-size:13px}
.ob-step .b{width:24px;height:24px;border-radius:50%;border:1px solid var(--stroke-2);display:grid;place-items:center;font:600 11px var(--f-mono);flex:none;transition:.2s}
.ob-step.on{color:var(--text)} .ob-step.on .b{border-color:var(--accent);color:var(--accent)}
.ob-step.done{color:var(--text-2)} .ob-step.done .b{background:var(--accent);border-color:var(--accent);color:var(--text-on-accent)}
.ob-main{padding:var(--s6) var(--s8);display:flex;flex-direction:column}
.ob-main .grow{flex:1}
.ob-folders{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ob-folders .check{padding:10px 12px;border-radius:var(--r-md);background:var(--layer);border:1px solid var(--stroke)}
.ob-folders .check:hover{background:var(--layer-2)}
.idx-stages{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.idx-stage{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center}
.idx-stage .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--layer-2);color:var(--text-3)}
.idx-stage.run .st{color:var(--accent);background:var(--accent-soft)}
.idx-stage.ok .st{color:var(--text-on-accent);background:var(--accent)}
.idx-stage .st svg{width:14px;height:14px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* toasts */
.toasts{position:fixed;right:16px;bottom:64px;z-index:95;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100% - 32px))}
.toast{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 16px;border-radius:var(--r-lg);background:rgba(34,40,46,.95);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--stroke-2);box-shadow:0 16px 40px rgba(0,0,0,.5);animation:toastin .3s var(--ease)}
.toast.out{animation:toastout .25s var(--ease) forwards}
@keyframes toastin{from{opacity:0;transform:translateX(24px)}}
@keyframes toastout{to{opacity:0;transform:translateX(24px)}}
.toast .ti{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.toast .ti svg{width:12px;height:12px;stroke-width:2.4}
.toast.ok .ti{background:var(--ok);color:#06210f} .toast.err .ti{background:var(--err);color:#2b0606} .toast.info .ti{background:var(--accent);color:var(--text-on-accent)} .toast.warn .ti{background:var(--warn);color:#2b1d03}
.toast .tb{flex:1;min-width:0}
.toast .tb b{display:block;font-weight:600;font-size:13px}
.toast .tb span{font-size:12.5px;color:var(--text-2);word-break:break-word}
.toast .tb .btn{margin-top:8px}
.toast .x{color:var(--text-3);width:22px;height:22px;border-radius:5px;display:grid;place-items:center}
.toast .x:hover{background:var(--layer-3);color:var(--text)}

/* taskbar */
.taskbar{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:40;display:flex;align-items:center;justify-content:center;gap:4px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:rgba(18,22,27,.78);backdrop-filter:blur(40px) saturate(150%);-webkit-backdrop-filter:blur(40px) saturate(150%);border-top:1px solid var(--stroke)}
.tb-app{position:relative;width:40px;height:40px;border-radius:6px;display:grid;place-items:center;transition:background .12s}
.tb-app:hover{background:var(--layer-3)}
.tb-app::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:3px;background:var(--text-3);transition:width .2s,margin .2s,background .2s}
.tb-app.active::after{width:16px;margin-left:-8px;background:var(--accent)}
.tb-app.off::after{opacity:0}
.tb-app svg{width:24px;height:24px}
.tray{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:0;bottom:0;display:flex;align-items:center;gap:4px;font-size:12px}
.tray button{height:40px;padding:0 8px;border-radius:6px;display:flex;align-items:center;gap:8px;color:var(--text)}
.tray button:hover{background:var(--layer-3)}
.tray .clock{text-align:right;line-height:1.3;font-size:12px}
.tb-left{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:0;bottom:0;display:flex;align-items:center;font-size:12px;color:var(--text-2);gap:8px}

/* tray flyout */
.flyout{position:fixed;right:12px;bottom:56px;z-index:70;width:320px;max-width:calc(100% - 24px);border-radius:var(--r-lg);background:rgba(30,36,42,.94);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid var(--stroke-2);box-shadow:0 24px 60px rgba(0,0,0,.55);padding:var(--s4);animation:menuin .2s var(--ease)}

/* responsive */
@media (max-width: 1180px){
  .search-body{grid-template-columns:minmax(0,1fr) 340px}
  .act-grid,.bench-grid{grid-template-columns:minmax(0,1fr)}
  .home-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 920px){
  .grid-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search-body{grid-template-columns:minmax(0,1fr)}
  .preview{position:absolute;inset:0 0 0 auto;width:min(420px,100%);z-index:20;background:rgb(var(--mica) / .97);box-shadow:-20px 0 40px rgba(0,0,0,.4);transform:translateX(100%);transition:transform .25s var(--ease)}
  .preview.open{transform:none}
  .pv-close{display:inline-flex!important}
  .set-wrap{grid-template-columns:minmax(0,1fr)}
  .set-nav{position:static;flex-direction:row;overflow-x:auto}
  .set-nav button{flex:none}
  .ob{grid-template-columns:minmax(0,1fr)}
  .ob-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--stroke);padding:var(--s3)}
  .ob-step .lb{display:none}
  .types-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tips{grid-template-columns:minmax(0,1fr)}
}

`# DriveSync: Real Time Desktop Search Engine
## Project summary
This project develops a high-performance local desktop file utility that improves search speed and summary retrieval on Windows. Default file management queries become inefficient with deep directory trees and large quantities of documents. DriveSync resolves this with a custom background file indexing framework that catalogs drive properties, directory hierarchies and file names into optimized indexing structures. When a user runs a name search, the utility instantly returns matching file names and paths. An on-demand parsing engine reads the internal text of a selected file and generates a concise structural overview directly in the desktop panel, so users do not need to open files to verify their content.
## Objectives
Develop an efficient file monitoring utility that indexes selected local Windows directories. Implement a customized file name index for lookups that are much faster than native directory scanning. Create a text extraction subsystem that reads file streams and formats concise structural summaries on demand. Design a responsive dashboard that shows matched file paths alongside their text descriptions. Deploy a native standalone desktop application with minimal hardware overhead and completely offline operation.
## Implementation method
A background monitoring module walks selected directories and registers file names into an active index. Text segmentation analyzes headers, introductions and structural metadata paragraphs to extract an immediate content abstract. A periodic update mechanism refreshes the index after a set interval whenever files are added, modified or removed.
## Benefits
Developers, researchers, students and office professionals get instant lookups without heavy CPU or RAM use. Organizations with large local archives get fast offline search without sending internal data to cloud search platforms.`},
 {folder:'fyp', rel:'Docs\\Software Architecture Specification.docx', age:21*DAY, size:186400, text:
`# Software Architecture Specification
## Purpose and scope
This specification describes the components of DriveSync and how they cooperate to keep a local file index current. It covers the directory watcher, the indexing engine, the SQLite persistence layer, the parsing engine and the desktop shell.
## Component overview
The directory watcher subscribes to file system change notifications for every indexed folder and queues create, change, rename and delete events. The indexing engine consumes the queue and updates an in-memory token map that links name and path tokens to file identifiers. The persistence layer writes the index and the application settings to an embedded SQLite database so the index survives restarts. The parsing engine opens a file only when the user selects it and produces a structural outline and an extractive summary.
## Data flow
A full scan runs once when a folder is added. After that, only incremental updates are applied, which avoids repeated full-folder scans. A scheduled refresh reconciles the index with the disk in case notifications were missed while the service was stopped.
## Performance targets
Name lookups should complete in under one millisecond for personal-scale collections of up to one hundred thousand files. The background service should stay below two percent CPU while idle and below one hundred and fifty megabytes of memory.
## Risks
Change notifications can overflow when thousands of files change at once, so the watcher falls back to a targeted rescan of the affected folder. Locked files cannot be parsed, so the preview reports the lock instead of failing silently.`},

`# Literature survey notes
## Local-first retrieval
As We May Search benchmarks keyword, semantic and hybrid retrieval on collections from one thousand to one million documents. It shows that fully local search stays fast and accurate at personal scale, which supports offline, privacy-preserving file search.
## Real-time metadata indexing
Icicle combines a bulk snapshot pipeline with a real-time event monitor to keep a metadata index current on large HPC file systems. The bulk-scan-plus-live-monitor design is the same pattern DriveSync uses at desktop scale.
## Incremental indexing

## Why virtualize
Virtualization lets one physical server run several isolated virtual machines, which raises hardware utilization and simplifies provisioning.
## Hypervisors
A type 1 hypervisor runs directly on the hardware, while a type 2 hypervisor runs on top of a host operating system. Examples of type 1 hypervisors include KVM, Xen and Hyper-V.
## Full and para-virtualization
Full virtualization runs an unmodified guest operating system. Para-virtualization modifies the guest to call the hypervisor directly, which reduces overhead.
## Containers

 {folder:'uni', rel:'Analysis of Algorithms\\Notes - Shortest Paths.pdf', age:9*DAY, size:910000, text:
`# Shortest paths
## Dijkstra's algorithm
Dijkstra's algorithm finds shortest paths from one source in a graph with non-negative edge weights. With a binary heap it runs in O((V + E) log V) time.
## Bellman-Ford
Bellman-Ford handles negative edge weights and detects negative cycles. It relaxes every edge V minus one times and runs in O(VE) time.
## Floyd-Warshall
Floyd-Warshall computes all-pairs shortest paths with dynamic programming in O(V cubed) time.`},

  if (f.topic==='code-cs' || (f.kind==='code' && f.ext==='cs')){

    const ns = 'DriveSync.' + f.rel.split('\\').slice(1,-1).filter(s=>!/^src$/.test(s)).join('.').replace(/DriveSync\./g,'');
    return `namespace ${ns || 'DriveSync'};\n/// ${cls} for the ${f.rel.split('\\').slice(-2,-1)[0]} module.\npublic ${/^I[A-Z]/.test(cls)?'interface':'sealed class'} ${cls} {\n${[...new Set(ms)].join('\n')}\n}`;
  }
  if (f.topic==='code-dart' || f.ext==='dart'){
    const cls = base.split('_').map(s=>s[0].toUpperCase()+s.slice(1)).join('');
    return `import 'package:flutter/material.dart';\n/// ${cls} widget.\nclass ${cls} extends ${/screen|sheet|editor|list/.test(base)?'StatefulWidget':'StatelessWidget'} {\n  const ${cls}({super.key});\n  Widget build(BuildContext context)\n  void _onTap()\n}\nclass _${cls}State extends State<${cls}> {\n  void initState()\n  void dispose()\n}`;

/* ---------- index ---------- */
const IDX = {map:new Map(), tokens:[], live:[], byId:new Map(), buildMs:0};
function tokenize(s){ return String(s).replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean); }
function isExcluded(f){
  const segs = f.rel.toLowerCase().split('\\');
  for (const p0 of ST.exclusions){
    const p = p0.toLowerCase();
    if (p.startsWith('*.')) { if (f.name.toLowerCase().endsWith(p.slice(1))) return true; }
    else if (p.includes('\\')) { if (f.path.toLowerCase().startsWith(p)) return true; }
    else if (segs.slice(0,-1).includes(p)) return true;
  }
  if (!S.hidden && f.name.startsWith('~$')) return true;
  return false;
}
function rebuildIndex(){
  const t0 = performance.now();
  const fids = new Set(ST.folders.map(f=>f.id));
  IDX.map = new Map(); IDX.byId = new Map();
  IDX.live = ST.cleared ? [] : FILES.filter(f => fids.has(f.folder) && !isExcluded(f));
  for (const f of IDX.live){
    IDX.byId.set(f.id, f);
    const toks = new Set([...tokenize(f.name), ...tokenize(f.rel.split('\\').slice(0,-1).join(' ')), ...tokenize(folderOf(f).name)]);
    toks.add(f.ext);
    for (const t of toks){ let a = IDX.map.get(t); if(!a){a=[];IDX.map.set(t,a);} a.push(f.id); }
  }
  IDX.tokens = [...IDX.map.keys()].sort();
  IDX.buildMs = performance.now() - t0;
}
const folderOf = f => ST.folders.find(x=>x.id===f.folder) || {name:'', path:''};
function lowerBound(arr, x){ let lo=0, hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<x) lo=m+1; else hi=m; } return lo; }
function prefixIds(term){
  const out = new Set();
  for (let i = lowerBound(IDX.tokens, term); i < IDX.tokens.length && IDX.tokens[i].startsWith(term); i++) for (const id of IDX.map.get(IDX.tokens[i])) out.add(id);
  return out;
}
const TYPE_GROUPS = {all:null, doc:['doc'], pdf:['pdf'], sheet:['sheet'], slides:['slides'], code:['code'], text:['text'], image:['image'], other:['db','zip']};
function parseQuery(q){
  const out = {terms:[], ext:null, inF:null, type:null};
  for (const w of q.trim().split(/\s+/).filter(Boolean)){
    const m = w.match(/^(ext|in|type):(.+)$/i);
    if (m){ const k=m[1].toLowerCase(), v=m[2].toLowerCase().replace(/^\./,''); if(k==='ext') out.ext=v; else if(k==='in') out.inF=v; else out.type=v; }
    else out.terms.push(...tokenize(w));
  }
  return out;
}
function runSearch(){
  const q = ST.q, F = ST.filters;
  const t0 = performance.now();
  const P = parseQuery(q);
  let ids = null;
  for (const t of P.terms){ const s = prefixIds(t); ids = ids ? new Set([...ids].filter(x=>s.has(x))) : s; if(!ids.size) break; }
  let cands = ids ? [...ids].map(id=>IDX.byId.get(id)) : (P.ext||P.inF||P.type||F.type!=='all'||F.folder!=='all'||F.mod!=='any' ? IDX.live.slice() : []);
  let fuzzy = false;
  if (ids && !ids.size && P.terms.length){
    // fallback: in-order character match on names
    const needle = P.terms.join('');
    cands = IDX.live.filter(f=>{ const n=f.name.toLowerCase(); let i=0; for(const ch of n){ if(ch===needle[i]) i++; if(i===needle.length) return true; } return false; });
    fuzzy = cands.length>0;
  }
  const now = Date.now(), yStart = new Date(new Date().getFullYear(),0,1).getTime();
  const modLim = {any:0, today: now-DAY, week: now-7*DAY, month: now-30*DAY, year: yStart}[F.mod];
  const tg = TYPE_GROUPS[F.type];
  const qt = P.type ? Object.entries(KINDS).filter(([k,v])=>k.startsWith(P.type)||v.short.toLowerCase().startsWith(P.type)).map(([k])=>k) : null;
  cands = cands.filter(f => (!P.ext || f.ext===P.ext) && (!P.inF || f.path.toLowerCase().includes(P.inF)) && (!qt || qt.includes(f.kind)) && (!tg || tg.includes(f.kind)) && (F.folder==='all' || f.folder===F.folder) && f.modified >= modLim);
  for (const f of cands){
    const nt = tokenize(f.name); let s = 0;
    for (const t of P.terms){ if (nt.includes(t)) s+=6; else if (nt.some(x=>x.startsWith(t))) s+=4; else s+=1; }
    if (P.terms[0] && f.name.toLowerCase().startsWith(P.terms[0])) s+=3;
    s += Math.max(0, 2 - (now-f.modified)/(30*DAY)) - f.rel.split('\\').length*.08 + (f.isNew?.5:0);
    f._s = s;
  }
  const sorters = {best:(a,b)=>b._s-a._s, name:(a,b)=>a.name.localeCompare(b.name), modified:(a,b)=>b.modified-a.modified, size:(a,b)=>b.size-a.size};
  cands.sort(sorters[F.sort]);
  const ms = performance.now() - t0;
  ST.results = cands; ST.fuzzy = fuzzy; ST.lastMs = ms;
  if (q.trim()) { ST.lookups.push(ms); if (ST.lookups.length>60) ST.lookups.shift(); }
  return ms;
}
function highlight(name, terms){
  if (!terms.length) return esc(name);
  const low = name.toLowerCase(), marks = new Array(name.length).fill(false);
  for (const t of terms){ let i = -1; while((i = low.indexOf(t, i+1)) !== -1){ const prev = low[i-1]; if (i===0 || /[^a-z0-9]/.test(prev) || (name[i]>='A'&&name[i]<='Z')) { for(let k=i;k<i+t.length;k++) marks[k]=true; break; } } }
  let out='', open=false;
  for (let i=0;i<name.length;i++){ if(marks[i]&&!open){out+='<mark>';open=true;} if(!marks[i]&&open){out+='</mark>';open=false;} out+=esc(name[i]); }
  return out + (open?'</mark>':'');
}

/* ---------- summarizer ---------- */
const STOP = new Set('a an the and or of to in on for with by is are was were be been this that these those it its as at from into than then so such can will would should may might must not no do does did has have had which who whom what when where while also each every one two three more most other some any only own same very just over under after before between both during through up down out off about their they them there here our we you your file files'.split(' '));
function summarize(f){
  const text = synthText(f);
  if (f.kind==='code'){
    const doc = (text.match(/\/\/\/ (.+)|# (.+)/)||[])[1] || (text.match(/# (.+)/)||[])[1] || '';
    const types = [...text.matchAll(/(?:class|interface|record)\s+(\w+)/g)].map(m=>m[1]);
    const members = [...text.matchAll(/^\s*(?:public |private |def |Widget |void )[^\n(]*?(\w+)\(/gm)].map(m=>m[1]);
    const lang = {cs:'C#',dart:'Dart',py:'Python'}[f.ext] || f.ext.toUpperCase();
    const sentences = [doc && (doc.endsWith('.')?doc:doc+'.'), types.length ? `Declares ${types.length===1?'the type':types.length+' types:'} ${types.join(', ')}.` : `${lang} file with ${text.split('\n').length} lines.`, members.length ? `Members: ${[...new Set(members)].slice(0,8).join(', ')}.` : ''].filter(Boolean);
    return {sentences, keywords:[lang, ...types.slice(0,3), ...new Set(members.slice(0,2))], words: text.split(/\s+/).length, lang, code:true};
  }
  const lines = text.split('\n'); const sents = []; let sec = 0, first = true;
  for (const ln of lines){
    if (ln.startsWith('#')) { sec++; first = true; continue; }
    for (const s of ln.split(/(?<=[.!?])\s+/).filter(x=>x.trim().length>20)){ sents.push({s:s.trim(), sec, first, i:sents.length}); first=false; }
  }
  const tf = new Map(); const words = text.toLowerCase().match(/[a-z][a-z-]{2,}/g) || [];
  for (const w of words) if (!STOP.has(w)) tf.set(w, (tf.get(w)||0)+1);
  for (const o of sents){ const ws = (o.s.toLowerCase().match(/[a-z][a-z-]{2,}/g)||[]).filter(w=>!STOP.has(w)); o.score = ws.reduce((a,w)=>a+(tf.get(w)||0),0)/Math.pow(Math.max(ws.length,1),.55) * (1 + (o.first?.35:0) + (o.i<2?.3:0)); }
  const n = Math.min(S.sumLen, sents.length);
  const top = [...sents].sort((a,b)=>b.score-a.score).slice(0,n).sort((a,b)=>a.i-b.i).map(o=>o.s);
  const kw = [...tf.entries()].filter(([w])=>w.length>3).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([w])=>w);
  const scaled = Math.round(words.length * Math.max(1, f.size/ (text.length*1.2)) ** .35);
  return {sentences: top, keywords: kw, words: Math.max(words.length, Math.min(scaled, 60000))};
}
function outline(f){
  const text = synthText(f);
  if (f.kind==='code'){
    const out=[];
    for (const ln of text.split('\n')){
      let m;
      if ((m = ln.match(/^(?:namespace|import)\s+([^;]+);?/))) out.push({lv:1, t:(ln.startsWith('import')?'import ':'namespace ')+m[1]});
      else if ((m = ln.match(/(?:class|interface|record)\s+(\w+)/))) out.push({lv:2, t:ln.trim().replace(/\{$/,'').trim()});
      else if (/^\s+(?:public|private|def|Widget|void)\b.*\(/.test(ln) || /^def /.test(ln)) out.push({lv:3, t:ln.trim()});
    }
    return out;
  }
  return text.split('\n').filter(l=>l.startsWith('#')).map(l=>({lv:l.startsWith('## ')?2:1, t:l.replace(/^#+\s*/,'')}));
}

/* ---------- toasts ---------- */
function toast({kind='info', title, msg='', action, ms=4600}){
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.setAttribute('role','status');
  el.innerHTML = `<span class="ti">${ic({ok:'i-check',err:'i-x',warn:'i-warn',info:'i-info'}[kind])}</span><div class="tb"><b>${esc(title)}</b>${msg?`<span>${esc(msg)}</span>`:''}${action?`<div><button class="btn sm">${esc(action.label)}</button></div>`:''}</div><button class="x" aria-label="Dismiss">${ic('i-x')}</button>`;
  const kill = () => { if(!el.isConnected) return; el.classList.add('out'); setTimeout(()=>el.remove(), 260); };
  el.querySelector('.x').onclick = kill;
  if (action) el.querySelector('.tb .btn').onclick = () => { action.fn(); kill(); };
  $('#toasts').prepend(el);
  while ($('#toasts').children.length > 4) $('#toasts').lastElementChild.remove();
  setTimeout(kill, ms);
}

/* ---------- menus & dropdowns ---------- */
let menuState = null;
function closeMenu(){ if(!menuState) return; menuState.el.remove(); menuState.anchor?.closest('.dd')?.classList.remove('open'); menuState.anchor?.setAttribute('aria-expanded','false'); const a = menuState.anchor; menuState = null; a?.focus?.({preventScroll:true}); }
function openMenu(anchor, items, at){
  closeMenu();
  const el = document.createElement('div'); el.className = 'menu'; el.setAttribute('role','menu');
  el.innerHTML = items.map((it,i)=> it.sep ? '<hr>' : `<button role="menuitem${it.checked!==undefined?'radio':''}" data-i="${i}" ${it.checked!==undefined?`aria-checked="${!!it.checked}"`:''} class="${it.danger?'danger':''}">${it.checked!==undefined?ic('i-check','tick'):''}${it.icon?ic(it.icon):''}<span>${esc(it.label)}</span>${it.kbd?`<span class="kbd">${esc(it.kbd)}</span>`:''}</button>`).join('');
  $('#menuHost').append(el);
  const W = innerWidth, H = innerHeight, mw = el.offsetWidth, mh = el.offsetHeight;
  let x, y;
  if (at){ x = at.x; y = at.y; } else { const r = anchor.getBoundingClientRect(); x = r.left; y = r.bottom + 4; el.style.minWidth = Math.max(200, r.width)+'px'; if (y + mh > H - 56) y = r.top - mh - 4; }
  el.style.left = Math.max(8, Math.min(x, W - mw - 8)) + 'px';
  el.style.top = Math.max(8, Math.min(y, H - mh - 8)) + 'px';
  el.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if(!b) return; const it = items[+b.dataset.i]; closeMenu(); it.fn?.(); });
  menuState = {el, anchor, items};
  anchor?.closest('.dd')?.classList.add('open'); anchor?.setAttribute('aria-expanded','true');
  const btns = $$('button', el); const cur = btns.findIndex(b=>b.getAttribute('aria-checked')==='true');
  (btns[cur>=0?cur:0])?.focus({preventScroll:true});
}
document.addEventListener('mousedown', e => { if (menuState && !menuState.el.contains(e.target) && !menuState.anchor?.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => {
  if (!menuState) return;
  const btns = $$('button', menuState.el); const i = btns.indexOf(document.activeElement);
  if (e.key==='ArrowDown'){ e.preventDefault(); btns[(i+1)%btns.length].focus(); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); btns[(i-1+btns.length)%btns.length].focus(); }
  else if (e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); closeMenu(); }
  else if (e.key==='Tab'){ closeMenu(); }
}, true);
window.addEventListener('resize', closeMenu);

const DD = {};
function dd(id, label, options, value, onChange){
  DD[id] = {options, onChange};
  const cur = options.find(o=>o.v===value) || options[0];
  return `<div class="dd"><button class="dd-btn" data-dd="${id}" aria-haspopup="menu" aria-expanded="false">${label?`<span class="k">${esc(label)}</span>`:''}<span>${esc(cur.l)}</span>${ic('i-chev')}</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dd]'); if(!b) return;
  const d = DD[b.dataset.dd]; if(!d) return;
  if (menuState && menuState.anchor === b) { closeMenu(); return; }
  const curLabel = b.querySelector('span:not(.k)').textContent;
  openMenu(b, d.options.map(o=>({label:o.l, checked:o.l===curLabel, fn:()=>{ b.querySelector('span:not(.k)').textContent=o.l; d.onChange(o.v); }})));
});

/* ---------- dialogs ---------- */
let dlgCleanup = null, dlgReturn = null;
function openDialog(html, {wide=false, onMount, label='Dialog'}={}){
  closeMenu();
  dlgReturn = document.activeElement;
  const d = $('#dialog'); d.className = 'dialog' + (wide?' wide':''); d.setAttribute('aria-label', label); d.innerHTML = html;
  $('#scrim').hidden = false;
  dlgCleanup = onMount?.(d) || null;
  setTimeout(()=>{ (d.querySelector('[autofocus]') || d.querySelector('input,button.primary,button'))?.focus(); }, 30);
}
function closeDialog(){ if ($('#scrim').hidden) return; $('#scrim').hidden = true; $('#dialog').innerHTML=''; if (typeof dlgCleanup==='function') dlgCleanup(); dlgCleanup=null; dlgReturn?.focus?.({preventScroll:true}); }
$('#scrim').addEventListener('mousedown', e => { if (e.target.id==='scrim') closeDialog(); });
document.addEventListener('keydown', e => {
  if ($('#scrim').hidden) return;
  if (e.key==='Escape'){ e.preventDefault(); closeDialog(); }
  if (e.key==='Tab'){ const f = $$('button:not([disabled]),input:not([disabled]),[tabindex="0"],select', $('#dialog')).filter(x=>x.offsetParent); if(!f.length) return; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();} else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();} }
});

/* ---------- clipboard ---------- */
function copyText(text, what='Path'){
  const ok = () => toast({kind:'ok', title:`${what} copied`, msg:text, ms:3000});
  try { navigator.clipboard.writeText(text).then(ok).catch(()=>toast({kind:'warn', title:'Copy was blocked', msg:'Select the text and press Ctrl+C: '+text, ms:7000})); }
  catch(e){ toast({kind:'warn', title:'Copy was blocked', msg:'Select the text and press Ctrl+C: '+text, ms:7000}); }
}

/* ---------- jobs (indexing, rescans, refresh) ---------- */
function runJob({label, ms=2400, folder=null, stage='index', done}){
  if (ST.busy){ toast({kind:'warn', title:'DriveSync is busy', msg:`Wait for “${ST.busy.label}” to finish, then try again.`}); return false; }
  ST.busy = {label, pct:0, folder, stage};
  const t0 = Date.now();
  if (folder){ const f = ST.folders.find(x=>x.id===folder); if(f){ f._prev = f.status==='scanning'?'watching':f.status; f.status='scanning'; } }
  updateChrome(); liveRefresh();
  const tick = setInterval(()=>{
    const p = Math.min(1, (Date.now()-t0)/ms);
    ST.busy.pct = p; ST.busy.stage = p<.15?'select':p<.7?'index':p<.92?'parse':'search';
    updateChrome(); updateBusyBits();
    if (p>=1){
      clearInterval(tick);
      if (folder){ const f = ST.folders.find(x=>x.id===folder); if(f){ f.status = f._prev==='paused'?'paused':'watching'; f.lastScan = Date.now(); } }
      ST.busy = null; ST.lastRefresh = Date.now(); ST.nextRefresh = Date.now() + S.refresh*MIN;
      rebuildIndex(); done?.(); updateChrome(); liveRefresh(true);
    }
  }, 80);
  return true;
}
function updateBusyBits(){
  const b = ST.busy; if(!b) return;
  $$('[data-busy-bar]').forEach(el=>{ el.style.width = Math.round(b.pct*100)+'%'; });
  $$('[data-busy-pct]').forEach(el=>{ el.textContent = Math.round(b.pct*100)+'%'; });
  const order=['select','index','parse','search'];
  $$('.stage[data-stage]').forEach(el=>{ const i=order.indexOf(el.dataset.stage), c=order.indexOf(b.stage); el.classList.toggle('on', i===c); el.querySelector('.s').textContent = i<c?'Done':i===c?'Running…':'Waiting'; });
}

/* ---------- chrome: title status, nav mini, badge, tray ---------- */
function liveCount(){ return IDX.live.length; }
function updateChrome(){
  const chip = $('#statusText'), dot = $('#statusDot');
  let txt, cls;
  if (ST.busy){ txt = `${ST.busy.label} ${Math.round(ST.busy.pct*100)}%`; cls='busy'; }
  else if (ST.cleared){ txt = 'Index is empty'; cls='warn'; }
  else if (!ST.watching){ txt = `Paused · ${fmtNum(liveCount())} files`; cls='warn'; }
  else { txt = `Watching · ${fmtNum(liveCount())} files`; cls='live'; }
  chip.textContent = txt; dot.className = 'dot ' + cls; $('#trayDot').className = 'dot ' + cls;
  const mini = $('#navMini');
  mini.innerHTML = ST.busy
    ? `<div class="row"><span class="dot busy"></span><b style="font-weight:600">${esc(ST.busy.label)}</b><span class="faint num" data-busy-pct style="margin-left:auto">${Math.round(ST.busy.pct*100)}%</span></div><div class="bar"><i data-busy-bar style="width:${Math.round(ST.busy.pct*100)}%"></i></div>`
    : ST.cleared
    ? `<div class="row"><span class="dot warn"></span><b style="font-weight:600">Index is empty</b></div><div class="sub">Rebuild it from Settings</div>`
    : `<div class="row"><span class="dot ${ST.watching?'live':'warn'}"></span><b style="font-weight:600">${ST.watching?'Up to date':'Watching paused'}</b></div><div class="sub">Refreshed ${rel(ST.lastRefresh)}</div>`;
  const badge = $('#actBadge'); badge.hidden = !ST.unseen || ST.view==='activity'; badge.textContent = ST.unseen>99?'99+':ST.unseen;
}

/* ---------- routing ---------- */
const VIEWS = {home:'Home', search:'Search', folders:'Indexed folders', activity:'Live activity', benchmarks:'Benchmarks', preferences:'Settings'};
function go(v, opts={}){
  if (!VIEWS[v]) v = 'home';
  if (location.hash !== '#'+v) { history.replaceState(null,'','#'+v); }
  const changed = ST.view !== v;
  ST.view = v;
  $$('.nav-item').forEach(a => { if (a.dataset.view===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#crumb').innerHTML = `${ic('i-chev-r')}<span>${VIEWS[v]}</span>`;
  $$('.view').forEach(s => s.hidden = s.dataset.v !== v);
  if (v==='activity') ST.unseen = 0;
  if (changed || opts.force) RENDER[v]();
  updateChrome();
  if (opts.focus) setTimeout(()=>$('#q')?.focus(), 20);
}
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
document.addEventListener('click', e => { const a = e.target.closest('a.nav-item'); if(!a) return; e.preventDefault(); go(a.dataset.view); if (a.dataset.view==='search') setTimeout(()=>$('#q')?.focus(),20); });
function liveRefresh(force){
  const v = ST.view;
  if (v==='home') renderHomeLive();
  else if (v==='search' && (ST.q || force)) { runSearch(); renderResults(); if(force) renderPreview(); }
  else if (v==='folders') renderFolders();
  else if (v==='activity') renderActivityLive();
  else if (v==='preferences' && force) renderPrefsLive();
}

/* ---------- shared bits ---------- */
function glyph(f, lg=false){ const k = KINDS[f.kind]; return `<span class="fg ${lg?'lg':''}" style="--c:${k.c}">${ic(k.icon)}${lg?`<span class="ext">${esc(f.ext.toUpperCase().slice(0,4))}</span>`:''}</span>`; }
function statusPill(f){
  if (f.status==='scanning') return `<span class="pill acc"><span class="dot busy" style="width:6px;height:6px;box-shadow:none"></span>Scanning <span data-busy-pct>${Math.round((ST.busy?.pct||0)*100)}%</span></span>`;
  if (f.status==='paused') return `<span class="pill mut">${ic('i-pause')}Paused</span>`;
  if (f.status==='unreachable') return `<span class="pill err">${ic('i-warn')}Drive not found</span>`;

function listKeys(e){

function startParse(f){
  if (ST.parsing.has(f.id)) return;
  ST.parsing.add(f.id);
  const delay = Math.min(1100, 260 + Math.sqrt(f.size)/6);
  const t0 = performance.now();
  setTimeout(() => {
    const s = summarize(f); s.ms = Math.round(performance.now()-t0);
    ST.sums.set(f.id, s); ST.parsing.delete(f.id);
    if (ST.sel === f.id && ST.view==='search') renderPvBody(f);
  }, delay);
}

function excludeDir(dir){

function validatePath(v){
  v = v.trim().replace(/[\\/]+$/,'').replace(/\//g,'\\');
  if (!v) return {err:'Enter the full path of a folder.'};
  if (!/^[A-Za-z]:\\[^<>:"|?*]*$/.test(v) && !/^[A-Za-z]:$/.test(v)) return {err:'Use a full Windows path that starts with a drive letter, like C:\\Users\\Rooheen\\Desktop.'};
  const low = v.toLowerCase();
  const same = ST.folders.find(f=>f.path.toLowerCase()===low); if (same) return {err:`This folder is already indexed as “${same.name}”.`};
  const parent = ST.folders.find(f=>low.startsWith(f.path.toLowerCase()+'\\')); if (parent) return {err:`It's already covered by “${parent.name}” (${parent.path}).`};
  if (/^[a-z]:$/i.test(v) || /^[a-z]:\\windows/i.test(v)) return {v, warn:'Indexing a whole drive or the Windows folder adds many system files and takes longer.'};
  const kids = ST.folders.filter(f=>f.path.toLowerCase().startsWith(low+'\\')); if (kids.length) return {v, warn:`Includes ${kids.length} folder${kids.length>1?'s':''} you already index (${kids.map(k=>k.name).join(', ')}). They'll be merged.`};
  if (/^e:/i.test(v)) return {err:'Drive E: isn\'t connected. Plug it in, then add the folder.'};
  return {v};
}

const GEN_BANK = {
  desktop:['Screenshot 2026-11-0%d.png','Meeting notes %d.txt','To do %d.txt','DriveSync demo script v%d.docx','Shortcut list %d.txt','CV draft %d.docx'],
  documents:['Letter %d.docx','Budget %d.xlsx','Scan %d.pdf','Notes %d.md','Receipt %d.pdf','Plan %d.docx'],

  music:['Playlist %d.txt','Recording %d.zip','Lyrics notes %d.txt'],
  other:['Document %d.docx','Report %d.pdf','Data %d.csv','Image %d.png','Notes %d.txt','Slides %d.pptx'],
};
function addFolder(path, name, types){
  const id = 'f' + Date.now().toString(36);
  const leaf = path.split('\\').pop() || path;
  const f = {id, name: name || leaf, path, status:'watching', subfolders:true};
  ST.folders.push(f);
  const bank = GEN_BANK[leaf.toLowerCase()] || GEN_BANK.other;
  const n = between(40,140); let made = 0;
  for (let i=0;i<n;i++){
    const nm = pick(bank).replace('%d', between(1,9)) ; const sub = rnd()<.4 ? pick(['Old','2026','Work','Uni']) + '\\' : '';
    const k = kindOf(nm); const grp = Object.entries(TYPE_GROUPS).find(([g,v])=>v&&v.includes(k))?.[0];
    if (!types.includes(grp)) continue;
    if (FILES.some(x=>x.path.toLowerCase()===(path+'\\'+sub+nm).toLowerCase())) continue;
    const file = addFile.call(null, 'fyp', sub+nm, {age:between(0,200)*DAY});
    file.folder = id; file.path = path + '\\' + sub + nm; made++;
  }
  runJob({label:`Scanning ${f.name}`, ms: 2600, folder:id, done:()=>{
    const cnt = folderFiles(id).length;
    toast({kind:'ok', title:`${f.name} is indexed`, msg:`${fmtNum(cnt)} files added. DriveSync will keep it up to date.`, action:{label:'Search it', fn:()=>{ ST.filters.folder=id; go('search',{force:true}); }}});
    pushEvent('added', FILES[FILES.length-1], true);
  }});
  if (ST.view==='folders') renderFolders();
}

/* ---------- watcher simulation ---------- */
let evSeq = 1;
function pushEvent(kind, file, quiet, from){
  const ev = {id: evSeq++, kind, file, t: Date.now(), from, folderName: folderOf(file).name};
  ST.events.unshift(ev); if (ST.events.length>300) ST.events.pop();
  if (ST.view!=='activity') ST.unseen++;
  updateChrome();
  if (ST.view==='activity') renderActivityLive(ev.id); else if (!quiet) liveRefresh();
  return ev;
}
const NEW_NAMES = {
  fyp:['Docs\\Meeting notes %s.docx','src\\DriveSync.Core\\Indexing\\TokenCache.cs','Benchmarks\\run-%s.csv','Docs\\Diagrams\\flow-%s.png','Docs\\Chapter 3 - Design %s.docx'],
  uni:['Cloud Computing\\Notes\\Kubernetes notes %s.md','Analysis of Algorithms\\Labs\\Lab 11 - Network Flow %s.docx','Technical Writing\\Assignment 3 - Report %s.docx','Information Security\\Quiz 2 prep %s.pdf'],
  proj:['expense_tracker\\lib\\widgets\\summary_tile_%s.dart','weather_app\\assets\\images\\rain_%s.png','notes_app\\lib\\services\\sync_service_%s.dart'],
};
function watcherTick(){
  if (!ST.watching || !S.instant || ST.cleared || ST.busy) return;
  const live = ST.folders.filter(f=>f.status==='watching' && NEW_NAMES[f.id]);
  if (!live.length) return;
  const fo = pick(live); const r = rnd();
  if (r < .34){
    const stamp = new Date().toTimeString().slice(0,5).replace(':','');
    const relp = pick(NEW_NAMES[fo.id]).replace('%s', stamp);
    if (FILES.some(x=>x.path===fo.path+'\\'+relp)) return;
    const f = addFile(fo.id, relp, {age:0, size: between(4,400)*1024}); f.isNew = true; f.indexed = Date.now();
    rebuildIndex(); pushEvent('added', f);
  } else if (r < .8){
    const pool = IDX.live.filter(f=>f.folder===fo.id && !f.locked); if(!pool.length) return;
    const f = pick(pool); f.modified = Date.now(); f.indexed = Date.now(); f.size = Math.max(512, f.size + between(-2048, 8192)); ST.sums.delete(f.id);
    pushEvent('modified', f);
  } else if (r < .9){
    const pool = IDX.live.filter(f=>f.folder===fo.id && f.isNew); if(!pool.length) return;
    const f = pick(pool); const old = f.rel; f.rel = f.rel.replace(/(\.[^.]+)$/, ' (final)$1'); f.name = f.rel.split('\\').pop(); f.path = fo.path+'\\'+f.rel;
    rebuildIndex(); pushEvent('renamed', f, false, old);
  } else {
    const pool = IDX.live.filter(f=>f.folder===fo.id && (f.isNew || /\.tmp$|Screenshot/.test(f.name))); if(!pool.length) return;
    const f = pick(pool); const i = FILES.indexOf(f); FILES.splice(i,1); if (ST.sel===f.id) ST.sel=null;
    rebuildIndex(); pushEvent('removed', f);
  }
}
function seedEvents(){
  for (const s of ACT_SEED){
    const f = FILES.find(x=>x.rel===s.f);
    if (!f || isExcluded(f)) continue;
    ST.events.push({id: evSeq++, kind:s.k, file:f, t: Date.now()-s.ago, from:s.from});
  }
  // a handful of older modifications from the index
  const pool = IDX.live.filter(f=>f.folder!=='bk' && Date.now()-f.modified < 3*DAY);
  pool.slice(0,10).forEach(f=>ST.events.push({id:evSeq++, kind:'modified', file:f, t:f.modified}));
  ST.events.sort((a,b)=>b.t-a.t);
}

async function runBench(){
  if (ST.benchRunning) return;
  ST.benchRunning = true; $$('[data-act="bench"]').forEach(b=>b.disabled=true);
  const sizes = [2000, 10000, 50000, 100000];
  const queries = ['proposal','lecture virtualization','index engine','lab 03','screenshot','dijkstra notes'];
  const base = FILES.map(f=>f.path);
  const res = [];
  for (let si=0; si<sizes.length; si++){
    const N = sizes[si];
    setBenchProgress(si/sizes.length, `Building a ${fmtNum(N)}-file collection…`);
    await sleep(40);
    const paths = new Array(N);
    for (let i=0;i<N;i++){ const p = base[i % base.length]; paths[i] = i < base.length ? p : p.replace(/\\([^\\]+)$/, `\\copy ${Math.floor(i/base.length)}\\$1`); }
    const tb = performance.now();
    const map = new Map();
    for (let i=0;i<N;i++){ const name = paths[i].slice(paths[i].lastIndexOf('\\')+1); for (const t of new Set(tokenize(paths[i]))) { let a=map.get(t); if(!a){a=[];map.set(t,a);} a.push(i); } }
    const toks = [...map.keys()].sort();
    const build = performance.now()-tb;
    await sleep(20);
    setBenchProgress((si+.5)/sizes.length, `Timing ${queries.length} queries on ${fmtNum(N)} files…`);
    await sleep(20);
    const idxT=[], linT=[];
    for (const q of queries){
      const terms = tokenize(q);
      const R = N <= 10000 ? 400 : 60;
      for (let rep=0; rep<5; rep++){
        let t0 = performance.now(), ids=null;
        for (let k=0;k<R;k++){ ids=null; for (const t of terms){ const s=new Set(); for(let i=lowerBound(toks,t); i<toks.length && toks[i].startsWith(t); i++) for(const id of map.get(toks[i])) s.add(id); ids = ids? new Set([...ids].filter(x=>s.has(x))) : s; } }
        idxT.push((performance.now()-t0)/R);
        t0 = performance.now(); let hits=0;
        for (let i=0;i<N;i++){ const low = paths[i].toLowerCase(); if (terms.every(t=>low.includes(t))) hits++; }
        linT.push(performance.now()-t0);
      }
    }
    res.push({N, idx: Math.max(.0005, median(idxT)), lin: Math.max(.001, median(linT)), build, tokens: toks.length});
    ST.bench = res.slice(); drawBench();
    await sleep(30);
  }
  ST.benchRunning = false; ST.benchAt = Date.now();
  $$('[data-act="bench"]').forEach(b=>{ b.disabled=false; b.innerHTML = ic('i-gauge')+'Run again'; });
  drawBench();
  const last = res[res.length-1];
  toast({kind:'ok', title:'Benchmark finished', msg:`At ${fmtNum(last.N)} files the index answered in ${fmtMs(last.idx)} versus ${fmtMs(last.lin)} for a full scan.`});
}
function setBenchProgress(p, label){ const c = $('#benchProg'); if (c){ c.querySelector('i').style.width = Math.round(p*100)+'%'; $('#benchProgL').textContent = label; } else if (ST.view==='benchmarks') { const host = $('#benchChart'); if(host && !ST.bench) host.innerHTML = `<div class="state" style="min-height:240px"><div class="faint" id="benchProgL">${esc(label)}</div><div class="bar" id="benchProg" style="width:240px"><i style="width:${Math.round(p*100)}%"></i></div></div>`; } }
function drawBench(){
  const host = $('#benchChart'), tbl = $('#benchTable'); if (!host) return;
  const B = ST.bench;
  if (!B || !B.length){ host.innerHTML = `<div class="state" style="min-height:240px"><div class="faint" id="benchProgL">Preparing…</div><div class="bar" id="benchProg" style="width:240px"><i></i></div></div>`; tbl.innerHTML = `<div class="skel"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:90%"></div>`; return; }
  const sizes = [2000,10000,50000,100000];
  const W=640, H=290, L=58, R=110, T=16, Bt=36;
  const all = B.flatMap(b=>[b.idx,b.lin]);
  const lo = Math.pow(10, Math.floor(Math.log10(Math.min(...all)))), hi = Math.pow(10, Math.ceil(Math.log10(Math.max(...all))));
  const y = v => T + (H-T-Bt) * (1 - (Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo)));
  const x = i => L + (W-L-R) * (i/(sizes.length-1));
  const decades = []; for (let e=Math.round(Math.log10(lo)); e<=Math.round(Math.log10(hi)); e++) decades.push(Math.pow(10,e));
  const line = (k, col) => { const pts = B.map((b,i)=>[x(i), y(b[k])]); return `<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.25" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="${i===pts.length-1?col:'var(--wall-1)'}" stroke="${col}" stroke-width="2"><title>${fmtNum(B[i].N)} files: ${fmtMs(B[i][k])}</title></circle>`).join('')}`; };
  const lastI = B.length-1;
  host.innerHTML = `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:420px" role="img" aria-label="Median lookup time by collection size">
    ${decades.map(d=>`<line x1="${L}" x2="${W-R}" y1="${y(d)}" y2="${y(d)}" stroke="var(--stroke)"/><text x="${L-8}" y="${y(d)+4}" text-anchor="end" class="lbl-mono">${+d.toPrecision(1)} ms</text>`).join('')}
    ${sizes.map((s,i)=>`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${s>=1000?(s/1000)+'k':s} files</text>`).join('')}
    ${line('lin','var(--text-3)')}${line('idx','var(--accent)')}
    <text x="${x(lastI)+12}" y="${y(B[lastI].lin)+4}" style="fill:var(--text-2);font-weight:600">${fmtMs(B[lastI].lin)}</text>
    <text x="${x(lastI)+12}" y="${y(B[lastI].idx)+4}" style="fill:var(--accent);font-weight:600">${fmtMs(B[lastI].idx)}</text>
  </svg></div><div class="faint" style="font-size:12px;margin-top:4px">${ST.benchRunning?'Measuring…':`Median of ${6*5} timed runs per size · log scale · measured ${ST.benchAt?rel(ST.benchAt):'just now'}`}</div>`;
  tbl.innerHTML = `<table class="btable"><thead><tr><th>Files</th><th>Indexed</th><th>Full scan</th><th>Faster</th></tr></thead><tbody>${B.map(b=>`<tr><td class="num">${fmtNum(b.N)}</td><td class="win">${fmtMs(b.idx)}</td><td>${fmtMs(b.lin)}</td><td>${Math.round(b.lin/b.idx)}×</td></tr>`).join('')}</tbody></table>
  <div class="kpi" style="margin-top:12px"><span class="muted">Index build, ${fmtNum(B[lastI].N)} files</span><span>${fmtMs(B[lastI].build)}</span></div><div class="kpi"><span class="muted">Distinct tokens</span><span>${fmtNum(B[lastI].tokens)}</span></div>`;
}

  if (k==='instant') toast({kind:'info', title: S.instant?'Instant updates on':'Instant updates off', msg: S.instant?'Changes appear in results within a second.':`The index refreshes every ${S.refresh} minutes instead.`, ms:2800});
  if (k==='autoSum') ST.sums.clear();
  if (k==='history' && !S.history){ /* keep list but hide */ }
  if (k==='tray') toast({kind:'info', title: S.tray?'DriveSync stays in the tray':'Closing quits DriveSync', msg: S.tray?'Closing the window keeps the index up to date.':'The index won\'t update while DriveSync is closed.', ms:3000});
});

    <div class="df"><button class="btn" data-close autofocus>Cancel</button><button class="btn danger" data-ok disabled>${ic('i-trash')}Clear index</button></div>`, {label:'Clear the index', onMount:d=>{
