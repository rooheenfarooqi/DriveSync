      $('[data-close]',d).onclick = closeDialog;
      $('[data-ok]',d).onclick = () => { ST.cleared = true; ST.sums.clear(); ST.sel=null; rebuildIndex(); closeDialog(); updateChrome(); liveRefresh(true); toast({kind:'warn', title:'Index cleared', msg:'Rebuild it to search again.', action:{label:'Rebuild now', fn:rebuild}, ms:8000}); };
  }});
}
function confirmRebuild(){
  if (ST.cleared) return rebuild();
  openDialog(`<div class="db"><h2>Rebuild the index?</h2><p class="desc">DriveSync scans all ${ST.folders.filter(f=>f.status!=='unreachable').length} reachable folders from scratch. It usually takes under a minute, and search keeps working while it runs.</p></div>
    <div class="df"><button class="btn" data-close>Cancel</button><button class="btn primary" data-ok autofocus>${ic('i-refresh')}Rebuild</button></div>`, {label:'Rebuild index', onMount:d=>{ $('[data-close]',d).onclick=closeDialog; $('[data-ok]',d).onclick=()=>{ closeDialog(); rebuild(); }; }});
}
function rebuild(){ runJob({label:'Rebuilding index', ms:3400, done:()=>{ ST.cleared=false; ST.sums.clear(); rebuildIndex(); toast({kind:'ok', title:'Index rebuilt', msg:`${fmtNum(liveCount())} files from ${ST.folders.length} folders, built in ${fmtMs(IDX.buildMs)}.`}); }}); }
function shortcutsDialog(){

/* ---------- onboarding ---------- */
function onboarding(){
  let step = 0; const picks = new Set(ST.folders.filter(f=>f.status!=='unreachable').map(f=>f.path)); const extra = [];
  const steps = ['Welcome','Choose folders','Build index','Ready'];
  const opts = () => [...ST.folders.filter(f=>f.status!=='unreachable').map(f=>[f.name,f.path,true]), ...QUICK.filter(([n,p])=>!ST.folders.some(f=>f.path===p)).slice(0,3).map(([n,p])=>[n,p,false]), ...extra.map(p=>[p.split('\\').pop(),p,false])];
  const draw = d => {
    d.innerHTML = `<div class="ob"><div class="ob-side"><div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><svg style="width:28px;height:28px"><use href="#logo"/></svg><b style="font:600 15px var(--f-display)">DriveSync</b></div>${steps.map((s,i)=>`<div class="ob-step ${i===step?'on':i<step?'done':''}"><span class="b">${i<step?ic('i-check'):i+1}</span><span class="lb">${s}</span></div>`).join('')}</div><div class="ob-main" id="obMain"></div></div>`;
    const m = $('#obMain', d);
    if (step===0){
      m.innerHTML = `<div class="eyebrow">Welcome</div><h2 style="margin:6px 0 8px;font:600 26px/1.2 var(--f-display);letter-spacing:-.015em">Find any file in a blink</h2><p class="muted" style="margin:0 0 20px;max-width:52ch">DriveSync keeps a live index of the folders you choose. Type part of a name and the file is there, with a short summary so you know it's the right one before you open it.</p>
      <div style="display:grid;gap:10px">${[['i-bolt','Instant name search','Lookups finish in well under a millisecond.'],['i-sparkle','Summaries on demand','Key sentences and an outline, made on this PC.'],['i-shield','Stays offline','Nothing about your files leaves your computer.']].map(([i,t,s])=>`<div style="display:flex;gap:12px;align-items:center"><span class="fg" style="--c:var(--accent)">${ic(i)}</span><div><b style="font-weight:600">${t}</b><div class="faint" style="font-size:12.5px">${s}</div></div></div>`).join('')}</div>
      <span class="grow"></span><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:24px"><button class="btn" data-ob="skip">Skip setup</button><button class="btn primary" data-ob="next" autofocus>Get started</button></div>`;
    } else if (step===1){
      m.innerHTML = `<div class="eyebrow">Step 2 of 4</div><h2 style="margin:6px 0 6px;font:600 22px/1.2 var(--f-display)">Which folders should DriveSync watch?</h2><p class="muted" style="margin:0">Pick the places you search most. You can change this any time in Indexed folders.</p>
      <div class="ob-folders">${opts().map(([n,p,on])=>`<label class="check"><input type="checkbox" value="${esc(p)}" ${picks.has(p)?'checked':''}><span class="box"><svg viewBox="0 0 20 20"><path d="m4 10.5 4 4 8-9" fill="none"/></svg></span><span style="min-width:0"><b style="font-weight:500">${esc(n)}</b><span class="mono faint" style="display:block;font-size:11px;word-break:break-all">${esc(p)}</span></span>${on?'<span class="pill ok" style="margin-left:auto">Indexed</span>':''}</label>`).join('')}</div>
      <form id="obAdd" style="display:flex;gap:8px;margin-top:10px"><input class="input mono" id="obPath" placeholder="Add another path, like D:\\Work" style="font-size:12px"><button class="btn">Add</button></form><div class="hint" id="obHint" style="margin-top:6px"></div>
      <span class="grow"></span><div style="display:flex;justify-content:space-between;gap:8px;margin-top:20px"><button class="btn" data-ob="back">Back</button><button class="btn primary" data-ob="next" id="obNext">Index ${picks.size} folder${picks.size===1?'':'s'}</button></div>`;
      $$('.ob-folders input', m).forEach(c => c.onchange = () => { c.checked ? picks.add(c.value) : picks.delete(c.value); $('#obNext',m).textContent = `Index ${picks.size} folder${picks.size===1?'':'s'}`; $('#obNext',m).disabled = !picks.size; $('#obHint',m).textContent = picks.size?'':'Pick at least one folder to continue.'; $('#obHint',m).className='hint err'; });
      $('#obAdd', m).addEventListener('submit', e => { e.preventDefault(); const r = validatePath($('#obPath',m).value); if (r.err && !/already indexed/.test(r.err)){ $('#obHint',m).className='hint err'; $('#obHint',m).textContent=r.err; return; } if (r.v){ extra.push(r.v); picks.add(r.v); draw(d); } });
    } else if (step===2){
      m.innerHTML = `<div class="eyebrow">Step 3 of 4</div><h2 style="margin:6px 0 6px;font:600 22px/1.2 var(--f-display)">Building your index</h2><p class="muted" style="margin:0">You can close this window. DriveSync finishes in the background.</p>
      <div class="idx-stages">${[['Select','Reading the folders you chose'],['Index','Turning names and paths into search tokens'],['Parse','Saving metadata to the local database'],['Search','Warming up the lookup engine']].map(([t,s],i)=>`<div class="idx-stage" data-st="${i}"><span class="st">${ic('i-clock')}</span><div><b style="font-weight:600">${t}</b><div class="faint" style="font-size:12px">${s}</div></div><span class="faint num" style="font-size:12px" data-c></span></div>`).join('')}</div>
      <div class="bar" style="margin-top:20px"><i id="obBar"></i></div><div class="faint num" style="font-size:12px;margin-top:6px" id="obCount">Starting…</div>
      <span class="grow"></span><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button class="btn" data-ob="bg">Continue in background</button></div>`;
      runOnboardIndex(d, m);
    } else {
      m.innerHTML = `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:12px;flex:1;justify-content:center"><span class="fg lg" style="--c:var(--ok)">${ic('i-check')}</span><h2 style="margin:0;font:600 26px/1.2 var(--f-display)">You're all set</h2><p class="muted" style="margin:0;max-width:50ch">DriveSync indexed <b style="color:var(--text)" class="num">${fmtNum(liveCount())}</b> files across ${ST.folders.length} folders and is now watching for changes. Press <kbd>Alt</kbd> <kbd>Space</kbd> from anywhere to search.</p></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button class="btn" data-ob="folders">Review folders</button><button class="btn primary" data-ob="done" autofocus>Start searching</button></div>`;
    }
    $$('[data-ob]', d).forEach(b => b.onclick = () => {
      const a = b.dataset.ob;
      if (a==='next'){ step++; draw(d); }
      else if (a==='back'){ step--; draw(d); }
      else if (a==='skip' || a==='bg'){ closeDialog(); if (a==='bg') toast({kind:'info', title:'Indexing continues in the background', msg:'You can search while DriveSync finishes.'}); }
      else if (a==='done'){ closeDialog(); go('search',{focus:true}); }
      else if (a==='folders'){ closeDialog(); go('folders'); }
    });
    setTimeout(()=>(d.querySelector('[autofocus]')||d.querySelector('button.primary'))?.focus(),20);
  };
  let obTimer;
  async function runOnboardIndex(d, m){
    // add any newly picked folders
    for (const p of picks){ if (!ST.folders.some(f=>f.path===p)){ const r = validatePath(p); if (r.v){ const leaf=p.split('\\').pop(); const id='f'+Math.random().toString(36).slice(2,8); ST.folders.push({id,name:leaf,path:p,status:'watching'}); const bank=GEN_BANK[leaf.toLowerCase()]||GEN_BANK.other; for(let i=0;i<between(40,120);i++){ const nm=pick(bank).replace('%d',between(1,9)); const pth=p+'\\'+nm; if(FILES.some(x=>x.path===pth)) continue; const f=addFile('fyp',nm,{age:between(0,200)*DAY}); f.folder=id; f.path=pth; } } } }
    for (const f of [...ST.folders]){ if (f.status!=='unreachable' && !picks.has(f.path)) ST.folders = ST.folders.filter(x=>x!==f); }
    rebuildIndex();
    const total = liveCount(); const t0 = Date.now(), dur = 3600;
    clearInterval(obTimer);
    obTimer = setInterval(() => {
      if (!d.isConnected || !$('#obBar')) { clearInterval(obTimer); updateChrome(); return; }
      const p = Math.min(1,(Date.now()-t0)/dur);
      $('#obBar').style.width = (p*100)+'%';
      $('#obCount').textContent = `${fmtNum(Math.round(total*p))} of ${fmtNum(total)} files`;
      $$('.idx-stage', m).forEach((s,i)=>{ const a=i/4, b=(i+1)/4; const st = p>=b?'ok':p>=a?'run':''; if (s.dataset.s!==st){ s.dataset.s=st; s.className='idx-stage '+st; s.querySelector('.st').innerHTML = st==='ok'?ic('i-check'):st==='run'?ic('i-refresh','spin'):ic('i-clock'); } s.querySelector('[data-c]').textContent = st==='ok'?'Done':st==='run'?Math.round((p-a)/(b-a)*100)+'%':''; });
      if (p>=1){ clearInterval(obTimer); ST.lastRefresh=Date.now(); updateChrome(); setTimeout(()=>{ if(d.isConnected && step===2){ step=3; draw(d); } }, 450); }
    }, 70);
  }
  openDialog('', {wide:true, label:'Set up DriveSync', onMount:d=>{ draw(d); return ()=>{ clearInterval(obTimer); ST.view && RENDER[ST.view](); updateChrome(); }; }});
}

/* ============================================================
   global actions (event delegation)
   ============================================================ */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); go(g.dataset.go); return; }
  const h = e.target.closest('[data-hist]'); if (h){ go('search'); setQuery(h.dataset.hist, true); $('#q')?.focus(); return; }
  const kw = e.target.closest('[data-kw]'); if (kw){ setQuery(kw.dataset.kw, true); return; }
  const of = e.target.closest('[data-open-file]'); if (of){ const f = IDX.byId.get(+of.dataset.openFile); if(!f) return; go('search'); setQuery(f.name.replace(/\.[^.]+$/,''), true); select(f.id); return; }
  const tab = e.target.closest('[data-tab]'); if (tab){ ST.tab = tab.dataset.tab; $$('.tabs [data-tab]').forEach(t=>t.setAttribute('aria-selected', t===tab)); const f = IDX.byId.get(ST.sel); if (f) renderPvBody(f); return; }
  const sb = e.target.closest('[data-sort]'); if (sb){ ST.filters.sort = sb.dataset.sort; renderSearch(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, f = ST.sel && IDX.byId.get(ST.sel), fid = a.dataset.f;
  switch(act){
    case 'add-folder': addFolderDialog(); break;
    case 'refresh-now': runJob({label:'Refreshing index', ms:1800, done:()=>toast({kind:'ok', title:'Index is up to date', msg:`${fmtNum(liveCount())} files checked in ${ST.folders.filter(x=>x.status==='watching').length} folders.`})}); break;
    case 'rebuild': confirmRebuild(); break;
    case 'clear-index': confirmClear(); break;
    case 'open': openFile(f); break;
    case 'reveal': reveal(f); break;
    case 'copy': copyText(f.path); break;
    case 'more-file': fileMenu(f, a); break;
    case 'pv-close': $('#preview').classList.remove('open'); break;
    case 'summarize': f._force = true; renderPvBody(f); break;
    case 'force-parse': f._force = true; renderPvBody(f); break;
    case 'limit': go('preferences'); setTimeout(()=>{ $('#maxParse')?.scrollIntoView({block:'center'}); $('#maxParse')?.focus(); }, 60); break;
    case 'retry-parse': { const body=$('#pvBody'); body.innerHTML = `<div class="state" style="min-height:220px"><span class="dot busy"></span><p>Checking whether the file is free…</p></div>`; setTimeout(()=>{ if (ST.sel===f.id) renderPvBody(f); toast({kind:'err', title:'Still open in Word', msg:'Save and close Final Report Draft.docx, then try again.'}); }, 900); break; }
    case 'retry-drive': { a.disabled = true; a.innerHTML = ic('i-refresh','spin') + 'Checking…'; setTimeout(()=>{ a.disabled=false; a.innerHTML = ic('i-refresh')+'Check again'; toast({kind:'err', title:'Drive E: still not found', msg:'Connect the external drive and DriveSync will reconnect on its own.'}); }, 1200); break; }
    case 'toggle-folder': { const fo = ST.folders.find(x=>x.id===fid); fo.status = fo.status==='paused'?'watching':'paused'; renderFolders(); toast({kind:fo.status==='paused'?'warn':'ok', title:`${fo.name} ${fo.status==='paused'?'paused':'resumed'}`, msg: fo.status==='paused'?'Its files stay searchable, but changes aren\'t tracked.':'DriveSync is watching it again.', ms:2800}); break; }
    case 'rescan': { const fo = ST.folders.find(x=>x.id===fid); runJob({label:`Scanning ${fo.name}`, ms:2200, folder:fid, done:()=>toast({kind:'ok', title:`${fo.name} rescanned`, msg:`${fmtNum(folderFiles(fid).length)} files, no missed changes.`})}); break; }
    case 'remove-folder': confirmRemove(fid); break;
    case 'rm-excl': { const x = a.dataset.x; const b=liveCount(); ST.exclusions = ST.exclusions.filter(y=>y!==x); rebuildIndex(); const d=liveCount()-b; renderFolders(); updateChrome(); $('#exclHint').className='hint ok'; $('#exclHint').textContent=`Removed “${x}”. ${d} file${d===1?'':'s'} added back to results.`; break; }
    case 'pause-all': toggleWatching(); if (ST.view==='folders') renderFolders(); break;
    case 'more': ST.shown += S.perPage; renderResults(); break;
    case 'reset-filters': ST.filters = {type:'all', folder:'all', mod:'any', sort:'best'}; renderSearch(); break;
    case 'strip-ops': setQuery(ST.q.split(/\s+/).filter(w=>!/^(ext|in|type):/i.test(w)).join(' '), true); break;
    case 'bench': runBench(); break;
    case 'clear-history': ST.history = []; a.disabled = true; toast({kind:'ok', title:'Search history cleared', ms:2200}); break;
    case 'copy-db': copyText('%LOCALAPPDATA%\\DriveSync\\index.db','Location'); break;
    case 'onboarding': onboarding(); break;
    case 'shortcuts': shortcutsDialog(); break;
    case 'reset-settings': S = {...DEFAULTS}; saveS(); applyAppearance(); renderPrefs(); toast({kind:'ok', title:'Settings restored to defaults', ms:2400}); break;
  }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!$('#scrim').hidden || menuState) return;
  const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName);
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); restoreWindow(); go('search',{focus:true}); $('#q')?.select(); }
  else if (e.key==='/' && !typing){ e.preventDefault(); go('search',{focus:true}); }
  else if ((e.ctrlKey||e.metaKey) && e.key===','){ e.preventDefault(); go('preferences'); }
  else if (e.key==='?' && !typing){ e.preventDefault(); shortcutsDialog(); }
  else if (e.altKey && /^[1-6]$/.test(e.key)){ e.preventDefault(); go(Object.keys(VIEWS)[+e.key-1]); }
  else if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key.toLowerCase()==='c' && ST.view==='search' && ST.sel){ e.preventDefault(); copyText(IDX.byId.get(ST.sel).path); }
  else if (e.key==='Escape' && $('#preview')?.classList.contains('open')) $('#preview').classList.remove('open');
});

/* ---------- boot ---------- */
const RENDER = {home:renderHome, search:renderSearch, folders:renderFolders, activity:renderActivity, benchmarks:renderBenchmarks, preferences:renderPrefs};
applyAppearance();
rebuildIndex();
seedEvents();
// warm-up lookups so the Home median has data
['proposal','lecture','index engine'].forEach(q=>{ ST.q=q; runSearch(); }); ST.q=''; ST.results=[];
clock(); setInterval(clock, 15e3); setWin('normal');
updateChrome();
go(location.hash.slice(1) || 'home');
let wTimer = 0, wNext = 9;
setInterval(() => {
  // countdown + scheduled refresh
  $$('[data-next]').forEach(el=>el.textContent = nextRefreshText());
  $$('[data-next-short]').forEach(el=>el.textContent = nextShort());
  if (!ST.busy && Date.now() >= ST.nextRefresh && ST.watching && !ST.cleared) runJob({label:'Scheduled refresh', ms:1500});
  if (++wTimer >= wNext){ wTimer = 0; wNext = between(8,15); watcherTick(); }
